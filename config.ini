Passwd = password
Id = uecsgw04

[uecsconsole]
Valid = yes
url = https://www.smart-agri.jp/~horimoto/m304/m304pushCND.php
; uecsconsoleへの並列POST送信ワーカー数。省略時は8。
; キュー満杯の警告(uecsconsole送信キューが満杯)が頻発する場合は増やしてみる。
; ただし根本的にuecsconsole側の応答が極端に遅い/落ちている場合は、
; ワーカーを増やしても改善しないので、まずPOST failed/timeoutログの
; 頻度を確認すること。
Workers = 8

[wh65lp]
; WH65LPが接続されているシリアルポート(RS485-USBアダプタ等)
SerialPort = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
; このホストが属するLANのブロードキャストアドレス。
; `ip -4 addr show` の inet 行に出る brd の値を指定してください。
; 不明な場合は 255.255.255.255 でも動く場合がありますが、環境依存のため
; 可能な限り実際のサブネットのブロードキャストアドレスを指定してください。
BroadcastAddr = 192.168.179.255
; UECS CCM電文の送信周期(秒)。UECS規約のA-10S-0(基本送信周期10秒)に合わせる。
SendInterval = 10
; この秒数以上、有効なWH65LPパケットを受信できていない場合は送信を止める。
; WH65LPの実測更新間隔(約16秒)より十分長く、UECS側の受信有効期間(30秒)より
; 長い値を推奨(デフォルト90秒)。
StaleAfter = 90

